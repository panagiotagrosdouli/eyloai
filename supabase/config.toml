project_id = "eyloai-local-integration"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = true
enable_anonymous_sign_ins = false

[storage]
enabled = true
file_size_limit = "25MiB"

[analytics]
enabled = false

[edge_runtime]
enabled = false

