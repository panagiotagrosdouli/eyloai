name: Public production smoke

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: 'Full Git SHA of the reviewed deployment'
        required: true
        type: string
      target_url:
        description: 'Reviewed public HTTPS origin to check'
        required: true
        default: 'https://eyloai.vercel.app'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check public routes and deployed commit
        env:
          EYLO_EXPECTED_GIT_SHA: ${{ inputs.expected_commit }}
          EYLO_SMOKE_URL: ${{ inputs.target_url }}
        run: |
          : "${EYLO_EXPECTED_GIT_SHA:?Provide the reviewed commit SHA}"
          node scripts/smoke-public.mjs
