name: Public production smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Reviewed public HTTPS origin to check'
        required: true
        default: 'https://eyloai.vercel.app'
      expected_deployment_sha:
        description: 'Full Git commit SHA of the deployment under test; smoke fails if either release identity differs'
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check public routes and deployed commit identity
        env:
          EYLO_SMOKE_URL: ${{ inputs.target_url }}
          EYLO_EXPECTED_GIT_SHA: ${{ inputs.expected_deployment_sha }}
        run: node scripts/smoke-public.mjs
