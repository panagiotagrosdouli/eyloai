name: EYLO Quality Gate

on:
  pull_request:
    branches: [main, feature/research-collaboration-vision]
  push:
    branches: [feature/unified-premium-workspace]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate imports, types, lint, tests and production build
        run: npm run check
      - name: Verify workspace and EYRA RLS in disposable PostgreSQL
        run: python3 scripts/integration/test-local-postgres.py
      - name: Verify preservation and canonical workflows on the observed legacy schema
        run: EYLO_SQL_LEGACY_SCHEMA=1 python3 scripts/integration/test-local-postgres.py
      - name: Verify the exact curated restoration sources without historical core replay
        run: EYLO_SQL_RESTORATION_BUNDLE=1 python3 scripts/integration/test-local-postgres.py

  supabase-stack:
    name: Disposable Supabase Auth, PostgREST, Storage and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Start isolated local Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/eylo-reviewed-migrations
          mkdir supabase/migrations
          restore_migrations() {
            rmdir supabase/migrations
            mv /tmp/eylo-reviewed-migrations supabase/migrations
          }
          trap restore_migrations EXIT
          supabase start
      - name: Replay reviewed local migration sequence and exercise real services
        shell: bash
        run: |
          set -euo pipefail
          set -a
          eval "$(supabase status -o env)"
          set +a
          python3 scripts/integration/test-local-supabase-stack.py
      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
